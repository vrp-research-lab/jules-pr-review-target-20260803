name: "CI Fixer T001 untrusted diagnostic"

on:
  pull_request:
    paths:
      - 'ci-fixer-t001/trigger/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run check
        run: node ci-fixer-t001/check.mjs
