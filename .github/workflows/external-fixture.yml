name: External fixture failure

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration fixture check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \n            "https://raw.githubusercontent.com/gbrlxvii/jules-ci-log-fixture-20260828/main/fixture.txt?run_id=${GITHUB_RUN_ID}" \n            --output /tmp/external-fixture.txt
          echo "External integration returned a failure:"
          cat /tmp/external-fixture.txt
          exit 1
