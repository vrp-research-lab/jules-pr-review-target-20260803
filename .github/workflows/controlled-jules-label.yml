name: Controlled Jules label
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Controlled issue number
        required: true
permissions:
  contents: read
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply reviewed Jules label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label jules
